name: budgetfamily
description: "Application d'optimisation financière pour familles et classe moyenne."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Génération des icônes d'application (lancer :  dart run flutter_launcher_icons)
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#0F5257"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
